<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Santa, played in Slack · Vilo Play</title>
<meta name="description" content="Secret Santa across every office, inside Slack: secret clues, real gifts delivered to the door and one live reveal. No spreadsheets. Free up to 25 people.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Vilo brand book v1.2 tokens */
  --paper:#F2F1F7;--white:#fff;--ink:#17171A;--ink2:#4E4D55;--mute:#6E6D75;
  --iris:#7C6CF0;--iris-s:#5B47F5;--iris-ink:#3B2BC4;
  --lilac:#CFC6FF;--peach:#FFD3B8;--mint:#BDEBD8;--sky:#C6DDFF;--butter:#FBE7A1;--rose:#F9C9DA;
  --line:#E3E1EC;
  /* per-game colour, set from the GAME config */
  --g:#F9C9DA;--gs:#D9577F;--g-soft:#FDEBF1;
  --r8:8px;--r14:14px;--r20:20px;--r28:28px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --head:'Gabarito','Hanken Grotesk',system-ui,sans-serif;--body:'Hanken Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);background:var(--paper);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--head);letter-spacing:-.035em;line-height:1.04;font-weight:700}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.sec{padding:112px 0;position:relative}
.sec h2{font-size:clamp(36px,5vw,62px);margin-top:14px}
.lead{font-size:19px;color:var(--ink2);max-width:620px;margin-top:18px}
.center{text-align:center}.center .lead{margin-left:auto;margin-right:auto}
/* marker (brand signature): one per headline */
.mk{background:linear-gradient(var(--g),var(--g)) no-repeat 0 88%/0% .46em;padding:0 .08em;transition:background-size .9s var(--ease) .25s;display:inline}
.mk.in,.no-js .mk{background-size:100% .46em}
/* buttons: every control is a pill */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:14px 24px;font-weight:600;font-size:15px;text-decoration:none;transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .22s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn.pri{background:var(--ink);color:#fff}
.btn.pri:hover{box-shadow:0 8px 20px rgba(23,23,26,.22)}
.btn.sec2{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(23,23,26,.2)}
.btn.sec2:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.glass{background:rgba(255,255,255,.5);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
:focus-visible{outline:3px solid var(--iris-s);outline-offset:3px}
/* header */
.bar{position:sticky;top:0;z-index:50;padding:12px 0}
.bar .wrap{display:flex;align-items:center;gap:28px;background:rgba(255,255,255,.62);backdrop-filter:blur(20px);border-radius:999px;padding:10px 12px 10px 22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 4px 24px rgba(40,30,90,.06);max-width:1152px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:700;font-size:26px;letter-spacing:-.04em;text-decoration:none}
.ring{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 70% 20%,#fff 0 18%,transparent 19%),conic-gradient(from 200deg,#B9A0F5,#D9B2E6,#FFBF97,#FFE7A3,#B9A0F5);-webkit-mask:radial-gradient(circle,transparent 0 38%,#000 40%);mask:radial-gradient(circle,transparent 0 38%,#000 40%)}
.nav{display:flex;gap:6px;margin-left:8px;flex:1}
.nav a{text-decoration:none;font-size:14px;font-weight:500;color:var(--ink2);padding:8px 12px;border-radius:999px}
.nav a:hover,.nav a.on{background:rgba(23,23,26,.06);color:var(--ink)}
.bar .login{font-size:14px;font-weight:600;text-decoration:none;padding:8px 10px}
.bar .btn{padding:10px 20px}
/* hero */
.hero{position:relative;padding:56px 0 96px;background:linear-gradient(180deg,var(--g-soft),var(--paper) 78%)}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border-radius:999px;padding:6px 14px 6px 8px;font-size:13px;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9)}
.tag i{width:20px;height:20px;border-radius:50%;background:var(--g);display:inline-block;box-shadow:inset 0 0 0 1.5px var(--gs)}
.hero h1{font-size:clamp(48px,7vw,88px);margin:22px 0 22px;letter-spacing:-.04em}
.hero p.sub{font-size:19px;color:var(--ink2);max-width:520px}
.hero .where{margin-top:14px;font-size:15px;font-weight:600;color:var(--ink)}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero .micro{margin-top:14px;font-size:14px;color:var(--mute)}
.scene{position:relative;min-height:460px}
.scene>*{display:none}
[data-hero="A"] .scene .sA,[data-hero="B"] .scene .sB,[data-hero="C"] .scene .sC{display:block}
/* illustration placeholders */
.ph{position:relative;border-radius:var(--r28);background:linear-gradient(135deg,var(--g),var(--g-soft));border:1.5px dashed rgba(23,23,26,.28);display:grid;place-items:center;color:var(--ink2);font-size:13px;font-weight:600;text-align:center;padding:12px;overflow:hidden}
.ph:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.65),transparent 45%);pointer-events:none}
.ph span{position:relative;display:block;max-width:180px}
.ph b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.65;margin-bottom:4px}
.sA .ph{height:440px}
.sB .ph{width:300px;height:300px;margin:60px auto 0;border-radius:50%}
.float{position:absolute;animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.glassc{background:rgba(255,255,255,.62);backdrop-filter:blur(22px);border-radius:var(--r20);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 18px 40px rgba(60,40,110,.12);padding:16px 18px}
.dm-card{width:300px;right:-6px;bottom:18px}
.dm-card .row{display:flex;align-items:center;gap:10px;margin-top:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--g);display:inline-block;flex:none;box-shadow:inset 0 0 0 1.5px var(--gs)}
.vav{width:34px;height:34px;border-radius:10px;background:var(--ink);display:grid;place-items:center;flex:none}
.vav i{width:18px;height:18px;border-radius:50%;background:conic-gradient(from 200deg,#B9A0F5,#D9B2E6,#FFBF97,#FFE7A3,#B9A0F5);-webkit-mask:radial-gradient(circle,transparent 0 38%,#000 40%);mask:radial-gradient(circle,transparent 0 38%,#000 40%)}
.dm-card small,.person small{display:block;color:var(--mute);font-size:13px}
.appt{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;background:var(--line);border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:1px}
/* logos */
.logos{padding:34px 0 8px}
.logos .eyebrow{text-align:center}
.logos .row{display:flex;justify-content:center;flex-wrap:wrap;gap:14px 44px;margin-top:20px}
.logos .row span{font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:-.03em;color:#8E8A9E}
/* demo stage */
.stage{position:relative;margin-top:44px}
.stage-in{display:grid;grid-template-columns:420px 1fr;gap:48px;align-items:start;padding-top:2vh}
.steps{display:flex;flex-direction:column;gap:10px}
.step{background:rgba(255,255,255,.55);border-radius:var(--r20);padding:16px 20px;cursor:pointer;transition:all .35s var(--ease);box-shadow:inset 0 0 0 1px var(--line)}
.step .t{display:flex;align-items:center;gap:14px;font-family:var(--head);font-weight:700;font-size:20px;letter-spacing:-.03em}
.step .n{font-size:13px;color:var(--mute);font-family:var(--body);font-weight:600;width:22px}
.step .d{max-height:0;opacity:0;overflow:hidden;transition:all .45s var(--ease);font-size:15px;color:var(--ink2)}
.step .when{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.step .tip{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:14px;font-weight:600;color:var(--ink)}
.step .tip:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gs);margin-top:7px;flex:none}
.dayd{text-align:center;font-size:12px;font-weight:700;color:var(--mute);margin-top:6px}
.pts{background:var(--butter);color:#6B4A0A;border-radius:999px;padding:3px 10px;font-weight:700;font-size:12.5px;display:inline-block}
.step.on{background:#fff;box-shadow:0 0 0 2px var(--ink),0 14px 30px rgba(60,40,110,.1)}
.step.on .d{max-height:260px;opacity:1;margin-top:10px}
.newtag{font-family:var(--body);font-size:11px;font-weight:700;background:var(--butter);border-radius:999px;padding:2px 9px;letter-spacing:.04em}
.pane{position:relative;display:flex;justify-content:center;align-items:flex-start;padding:0}
.pane .ph2{display:none}
.slack{width:470px;max-width:100%;display:flex;flex-direction:column;background:#fff;border-radius:var(--r14);box-shadow:0 24px 50px rgba(40,30,90,.18);overflow:hidden}
.slack .hd{background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;display:flex;justify-content:space-between}
.slack .bd{padding:6px 16px 16px;display:flex;flex-direction:column;gap:14px}
.slack{overflow:visible}.slack .hd{border-radius:var(--r14) var(--r14) 0 0}
.prs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.pr{display:flex;gap:10px;align-items:flex-start}
.pn{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;margin-top:4px}
.prb{position:relative;flex:1;background:#fff;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.psel{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--g-soft);border-radius:12px 12px 0 0;padding:9px 12px;font-weight:700;font-size:13.5px;color:#8A2F4B;text-align:left}
.psel i{font-style:normal;transition:transform .25s var(--ease)}
.psel:hover{background:var(--g)}
.pans{padding:9px 12px;font-size:14px;color:var(--ink)}
.pmenu{position:absolute;left:0;right:0;top:calc(100% - 4px);z-index:8;margin:0;padding:6px;list-style:none;background:#fff;border-radius:12px;box-shadow:0 14px 34px rgba(40,30,90,.22),inset 0 0 0 1px var(--line);animation:rise .3s var(--ease) both}
.pmenu button{width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px}
.pmenu button:hover{background:var(--g-soft)}
.m{display:flex;gap:10px;padding-top:12px;animation:rise .6s var(--ease) both}
.m>div{flex:1;font-size:14.5px;line-height:1.45}
.m .nm{font-weight:700;font-size:14px}.m .nm em{font-style:normal;color:var(--mute);font-weight:500;font-size:12px;margin-left:6px}
.m p{margin-top:4px;color:var(--ink2)}.m b{color:var(--ink)}
.m .kick{font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--gs);text-transform:uppercase}
.m .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sb{border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px;background:#007A5A;color:#fff;transition:transform .2s var(--ease),background .2s}
.sb:hover{transform:translateY(-1px) rotate(-1deg)}
.sb.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #CFCFD6}
.sb.pick{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #CFCFD6;text-align:left}
.sb.pick.sel{box-shadow:inset 0 0 0 2px var(--iris-s);background:#F6F4FF}
.sb.done{background:var(--mint);color:var(--ink);pointer-events:none}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{background:var(--g-soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.person{display:flex;align-items:center;gap:10px;margin-top:10px;background:#F6F5FA;border-radius:12px;padding:10px 12px}
.person b{display:block;font-size:14.5px}
.mini{font-size:12.5px;color:var(--mute);margin-top:8px}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hidden{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.cf{position:absolute;pointer-events:none;width:8px;height:12px;border-radius:2px;animation:cf 1.1s var(--ease) forwards;z-index:9}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.stage-m{display:none}
/* HR */
.hr{background:linear-gradient(180deg,var(--paper),#ECEAF6)}
.panel{margin-top:44px;border-radius:var(--r28);padding:34px;position:relative;overflow:hidden;background:rgba(255,255,255,.55);backdrop-filter:blur(24px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),0 24px 60px rgba(60,40,110,.1)}
.panel:before,.panel:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;filter:blur(70px);opacity:.7;z-index:-1}
.panel:before{background:var(--lilac);left:-60px;top:-80px}.panel:after{background:var(--g);right:-60px;bottom:-100px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{background:rgba(255,255,255,.75);border-radius:var(--r20);padding:24px;transition:transform .25s var(--ease)}
.kpi:hover{transform:translateY(-3px) rotate(-.6deg)}
.kpi .v{font-family:var(--head);font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1;background:linear-gradient(135deg,var(--iris-s),var(--gs));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .l{margin-top:8px;font-size:14px;font-weight:600;color:var(--ink2)}
.ex{margin-top:16px;font-size:12.5px;color:var(--mute);text-align:center}
.ctarow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:34px}
/* setup */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}
.card{background:#fff;border-radius:var(--r20);padding:24px;box-shadow:0 1px 2px rgba(40,30,90,.05),0 10px 30px rgba(40,30,90,.06);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(40,30,90,.12)}
.card .ph{height:150px;border-radius:var(--r14);margin-bottom:20px}
.card h3{font-size:26px}
.card p{color:var(--ink2);margin-top:10px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{background:var(--g-soft);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.slider{margin-top:16px}
.slider output{font-family:var(--head);font-weight:700;font-size:20px}
.slider input{width:100%;accent-color:var(--iris-s);margin-top:6px}
.slider .rng{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
/* timeline */
.tl{margin-top:56px;position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.tl:before{content:"";position:absolute;left:4%;right:4%;top:20px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--g),var(--iris))}
.tl div{position:relative;text-align:center;padding-top:46px;font-size:14px;font-weight:600}
.tl div:before{content:"";position:absolute;left:50%;top:10px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 4px var(--ink);transition:transform .25s var(--ease)}
.tl div:hover:before{transform:scale(1.25)}
.tl small{display:block;color:var(--mute);font-weight:500;margin-top:4px}
/* pricing */
.tiers{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:48px}
.tier{background:#fff;border:0;border-radius:var(--r20);padding:22px 18px;text-align:left;box-shadow:inset 0 0 0 1px var(--line);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.tier:hover{transform:translateY(-4px) rotate(-.8deg);box-shadow:inset 0 0 0 2px var(--ink),0 16px 30px rgba(40,30,90,.1)}
.tier small{display:block;font-size:13px;color:var(--mute);font-weight:600}
.tier b{display:block;font-family:var(--head);font-size:34px;letter-spacing:-.04em;margin-top:8px}
.tier span{font-size:13px;color:var(--mute)}
.tier.free b{background:linear-gradient(var(--mint),var(--mint)) no-repeat 0 88%/100% .42em;display:inline-block;padding:0 .1em}
.pnote{margin-top:22px;text-align:center;color:var(--ink2);font-size:15px}
/* quotes */
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}
.q{border-radius:var(--r28);padding:32px;backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85);transition:transform .3s var(--ease)}
.q:nth-child(2){margin-top:22px}
.q:hover{transform:translateY(-4px) rotate(.5deg)}
.q:nth-child(1){background:rgba(255,211,184,.65)}.q:nth-child(2){background:rgba(198,221,255,.7)}.q:nth-child(3){background:rgba(189,235,216,.7)}
.q i{font-family:var(--head);font-style:normal;font-size:72px;line-height:.6;display:block;height:34px}
.q:nth-child(1) i{color:#E2603C}.q:nth-child(2) i{color:#3E78D6}.q:nth-child(3) i{color:#2F9E74}
.q p{font-size:19px;line-height:1.4;font-weight:500}
.q small{display:block;margin-top:18px;font-weight:600;color:var(--ink2);font-size:14px}
/* faq */
.faq{display:grid;grid-template-columns:.8fr 1.4fr;gap:64px}
details{border-top:1px solid var(--line);padding:20px 0}
details:last-child{border-bottom:1px solid var(--line)}
summary{list-style:none;display:flex;justify-content:space-between;gap:20px;font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:-.02em;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-family:var(--body);font-weight:400;font-size:28px;line-height:.8;transition:transform .3s var(--ease)}
details[open] summary:after{transform:rotate(45deg)}
details p{margin-top:12px;color:var(--ink2);max-width:640px}
/* closing cta */
.endcta{margin:0 24px;border-radius:36px;padding:90px 24px;background:radial-gradient(ellipse at 20% 90%,var(--g),transparent 60%),var(--ink);color:#fff;text-align:center;position:relative;overflow:hidden}
.endcta h2{font-size:clamp(38px,6vw,72px);margin:16px auto;max-width:820px}
.endcta .tagline{display:inline-block;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600}
.endcta .btn.pri{background:#fff;color:var(--ink)}
.endcta .btn.sec2{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.endcta .micro{margin-top:16px;font-size:14px;color:rgba(255,255,255,.65)}
/* more games */
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:44px}
.gc{background:#fff;border-radius:var(--r20);padding:14px 14px 22px;text-decoration:none;box-shadow:0 10px 30px rgba(40,30,90,.06);transition:transform .25s var(--ease)}
.gc:hover{transform:translateY(-5px) rotate(-.6deg)}
.gc .ph{height:150px;border-radius:var(--r14);background:var(--c)}
.gc h3{font-size:24px;margin:16px 6px 4px}.gc p{margin:0 6px;color:var(--ink2);font-size:15px}
.gc .go{margin:14px 6px 0;font-weight:700;font-size:14px;display:inline-flex;gap:6px}
.head2{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
/* footer */
footer{padding:80px 0 40px;margin-top:60px}
.fcols{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:32px}
footer h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
footer li{list-style:none;font-size:14px;margin-bottom:8px}footer ul{padding:0}
footer a{text-decoration:none;color:var(--ink2)}footer a:hover{color:var(--ink)}

.hr{background:linear-gradient(180deg,#fff,#F3F3F3)}
.person{background:#F3F3F3}
.pts{background:var(--g);color:#17171A}
.kpi:nth-child(odd){background:var(--g)}
.kpi:nth-child(even){background:#fff;box-shadow:inset 0 0 0 1.5px #17171A}
.kpi .v{background:none;color:#17171A;-webkit-text-fill-color:#17171A}
.q:nth-child(1){background:var(--g)}
.q:nth-child(2){background:#fff;box-shadow:inset 0 0 0 1.5px #17171A}
.q:nth-child(3){background:#17171A;color:#fff}
.q:nth-child(n) i{color:#17171A}.q:nth-child(3) i{color:var(--g)}.q:nth-child(3) small{color:#d9d9d9}
.tier:nth-child(n){background:#fff}.tier:nth-child(1){background:var(--g)}
.chip:nth-child(even){background:#fff}
.games .gc:nth-child(1){--c:var(--g)}
.games .gc:nth-child(2){--c:#fff}
.games .gc:nth-child(3){--c:#17171A;color:#fff;box-shadow:12px -12px 0 var(--g)!important}
.games .gc:nth-child(3) :is(h3,p){color:#fff}
.games .gc:nth-child(3) .ph{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5);color:#fff}
.games .gc:nth-child(3) .drawer{background:var(--g)}
.games .gc:nth-child(3) .dbtn{background:#17171A;color:#fff}
.games .gc:nth-child(3):after{color:#fff}
.moon{background:var(--gs)}
/* several shades of the one page colour, for the cards */
html[data-look]{--t1:var(--g-soft);--t2:var(--g);--t3:color-mix(in srgb,var(--gs) 42%,#fff);--t4:var(--gs)}
.games .gc:nth-child(1){--c:var(--t2)}.games .gc:nth-child(2){--c:var(--t3)}
.games .gc:nth-child(3){--c:var(--t4);color:#17171A;box-shadow:12px -12px 0 #17171A!important}
.games .gc:nth-child(3) :is(h3,p){color:#17171A}
.games .gc:nth-child(3) .ph{background:rgba(255,255,255,.4);border-color:rgba(23,23,26,.4);color:inherit}
.games .gc:nth-child(3) .drawer{background:#17171A}
.games .gc:nth-child(3) .dbtn{background:var(--c);color:#17171A}
.games .gc:nth-child(3):after{color:#17171A}
.kpi:nth-child(1){background:var(--t2)}.kpi:nth-child(2){background:var(--t1);box-shadow:none}.kpi:nth-child(3){background:var(--t3)}.kpi:nth-child(4){background:var(--t2);box-shadow:none}
.q:nth-child(1){background:var(--t2)}
.q:nth-child(2){background:var(--t1);box-shadow:none}
.q:nth-child(3){background:var(--t3);color:#17171A}
.q:nth-child(3) i{color:#17171A}.q:nth-child(3) small{color:var(--ink2)}
.tier:nth-child(1){background:var(--t2)}.tier:nth-child(2),.tier:nth-child(3){background:var(--t1)}.tier:nth-child(4){background:var(--t2)}.tier:nth-child(5){background:var(--t3)}.tier:nth-child(6){background:var(--t4)}
.cards3 .card:nth-child(1) .ph{background:var(--t2)}.cards3 .card:nth-child(2) .ph{background:var(--t3)}.cards3 .card:nth-child(3) .ph{background:var(--t1)}
.chips .chip:nth-child(3n+1){background:var(--t1)}.chips .chip:nth-child(3n+2){background:var(--t2)}.chips .chip:nth-child(3n+3){background:var(--t3)}
/* real keys: they never lift, they press IN until they are flush with their shadow */
html[data-look] :is(.btn,.dbtn,.qr,.tier,.slack .sb){transition:transform .08s ease-out,box-shadow .08s ease-out,background .15s}
html[data-look] .btn:hover{transform:none!important;box-shadow:4px 4px 0 #17171A}
html[data-look] .btn.pri:hover{background:var(--t3)}
html[data-look] .btn.sec2:hover{background:var(--t1)}
html[data-look] .btn:active{transform:translate(4px,4px)!important;box-shadow:0 0 0 #17171A!important}
html[data-look] .endcta .btn:hover{box-shadow:4px 4px 0 rgba(255,255,255,.55)}
html[data-look] .dbtn{box-shadow:3px 3px 0 rgba(255,255,255,.5)}
html[data-look] .dbtn:hover{transform:none}
html[data-look] .dbtn:active{transform:translate(3px,3px)!important;box-shadow:0 0 0 transparent}
html[data-look] .qr{box-shadow:inset 0 0 0 1.5px #17171A,3px 3px 0 #17171A}
html[data-look] .qr:hover{transform:none}
html[data-look] .qr:active{transform:translate(3px,3px)!important;box-shadow:inset 0 0 0 1.5px #17171A,0 0 0 #17171A}
html[data-look] .tier{box-shadow:inset 0 0 0 1.5px #17171A,4px 4px 0 #17171A}
html[data-look] .tier:hover{transform:none}
html[data-look] .tier:active{transform:translate(4px,4px)!important;box-shadow:inset 0 0 0 1.5px #17171A,0 0 0 #17171A}
html[data-look] .slack .sb{box-shadow:2px 2px 0 #17171A}
html[data-look] .slack .sb:is(.ghost,.pick){box-shadow:inset 0 0 0 1.5px #17171A,2px 2px 0 #17171A}
html[data-look] .slack .sb:hover{transform:none}
html[data-look] .slack .sb:active{transform:translate(2px,2px)!important;box-shadow:inset 0 0 0 0 #17171A,0 0 0 #17171A}
@media (max-width:980px){.chat{height:500px}}
</style>
</head>
<body class="no-js">
<canvas id="snow" aria-hidden="true"></canvas>
<header class="bar"><div class="wrap">
  <a class="logo" href="#" aria-label="Vilo"><span class="ring"></span>vilo</a>
  <nav class="nav"><a href="#">Solutions</a><a href="#" class="on">Vilo Play</a><a href="#">Journeys</a><a href="#">Vilo Moments</a><a href="#">Resources</a></nav>
  <a class="login" href="#">Log in</a>
  <button class="btn pri" data-open>Play now</button>
</div></header>
<main id="app"></main>
<dialog id="dlg" aria-label="Start Secret Santa"><div id="dlgBody"></div></dialog>
<script>
/* ============ GAME CONFIG: a new game = new data + colour + mockups ============ */
const GAME={
  id:'secret-santa',name:'Secret Santa',
  color:{g:'#F9C9DA',gs:'#D9577F',soft:'#FDEBF1'},
  ambient:'none', /* snow is paused: set to 'snow' to bring it back */
  season:{state:'before',
    before:{tag:'Sign up by November 20 to reveal before the holidays.'},
    after:{tag:'[Copy from Vilo: after the deadline]'},
    off:{tag:'[Copy from Vilo: off season]'}},
  cta:{primary:'Play now',secondary:'Book a 15-minute call',micro:'No payment and no account.',call:'https://calendar.app.google/FKtRhMnwp7p7rTvn7'},
  hero:{h1a:'Secret Santa,',h1b:'played in Slack.',
    sub:'This season: sign up by November 20 to reveal before the holidays. Free up to 25 people, one 15-minute setup call, no HR team needed.',
    where:'Slack · Vilo mobile app · Vilo web app',art:'Painted winter scene',card:['Your match is here 🎁','Maya Cohen','Product Designer · Tel Aviv']},
  logos:{title:'Trusted by people teams at',items:['Eleos Health','Kela Technologies','Lightico','Moveo Group','Vetric','+ stealth startups']},
  demo:{eyebrow:'The game, as your people play it',h:['The whole season in ','one Slack DM.'],lead:'Scroll through the season the way one employee sees it. Every button you see is clickable.'},
  hrp:{h:['And HR sees all of it, ','live.'],lead:'Who joined, which offices are lagging, which gifts are still unopened. Without asking anyone.',
    kpis:[['Joined',96],['Clues sent',294],['Guesses locked',71],['Gifts opened',88]]},
  setup:{eyebrow:'For people teams',h:['You set it up once. ','It runs itself.'],cards:[
    {t:'Zero admin',p:'No spreadsheet, no hat, no chasing people for addresses. Vilo runs sign-ups, matching, reminders and delivery.',chips:['Sign-ups','Matching','Reminders','Delivery','Reveal'],art:'Admin'},
    {t:'A budget you set',p:'Set the budget per gift once. The gift shop only shows gifts within it, so people never see a price.',slider:true,art:'Gift'},
    {t:'Office or home',p:'The person receiving the gift chooses where it goes, so remote people are part of it from day one.',chips:['Office delivery','Home delivery','Swap a gift'],art:'Delivery'}]},
  timeline:{eyebrow:'The season at a glance',h:['One call. ','One season.'],items:[['One 15-minute call','[date]'],['One DM. One tap.','[date]'],['Joining closes','Mon 7 Dec · 12:00'],['Your person arrives.','Mon 7 Dec'],['Clues drop.','[dates]'],['A gift shop inside Slack.','[date]'],['The reveal.','[date]']]},
  pricing:{h:['What does it ','cost?'],lead:'Priced by team size. No payment on the site.',tiers:[['Up to 25 people','Free'],['26–100 people','$99'],['101–150 people','$159'],['151–200 people','$229'],['201–300 people','$299'],['More than 300','Let’s talk']],note:'Plus the gift budget per person you choose. Bigger than that, let’s talk.'},
  quotes:[['We used to plan one office at a time. Now Tel Aviv and New York play the same game on the same morning, and people actually talk about it.','Head of People · global tech company'],['I approve a brief and the rest just happens. Suppliers, sign-ups, the Slack posts. It gave me my weeks back.','Employee Experience Manager · fast-growing startup'],['Our remote people finally feel part of it. The buddy program alone changed how onboarding feels.','VP People · remote-first company']],
  faq:[['Where does it run?','Wherever your people already are: in Slack, in the Vilo mobile app, or in the Vilo web app. Nobody installs anything new to join.'],
    ['Is it really anonymous?','Yes. Clues are sent by Vilo with no name attached, and only Vilo knows who has whom. Names come out on reveal day.'],
    ['How do the clues work?','When people join, they fill in three secret prompts about themselves. During the season, Vilo sends those answers one at a time as clues to the person they\'re giving to. You can lock in a guess before reveal day.'],
    ['Who handles the gifts and the delivery?','Vilo, with our gifting partner. The Santa picks from a curated shop. The receiver opens a gift link, can swap the gift, and enters the delivery address. The Santa never sees it.'],
    ['What does it cost?','Free up to 25 people. Then $99 up to 100 people, $159 up to 150, $229 up to 200 and $299 up to 300, plus the gift budget per person you choose. Bigger than that, let\'s talk.'],
    ['How long does it take to set up?','One 15-minute call to set the dates, the gift catalog and who is invited. Your workspace is ready within the hour, and the invite can go out the same day.'],
    ['Can we give gift cards only?','Yes. Choose digital gift cards and nothing physical ships. Each person gets their gift by email, wherever they work.'],
    ['We don\'t have an HR team. Can we still run it?','Yes. Any team lead or founder can start it. It\'s free up to 25 people, the setup is one 15-minute call, and Vilo runs everything from the invite to the reveal.'],
    ['What if someone doesn\'t join?','Nobody is forced. Vilo sends a friendly reminder before joining closes, and everyone can still enjoy the reveal in the channel.']],
  end:{h:['Give your people the ','best December yet.']},
  more:{eyebrow:'Vilo Play',h:['Games that run in ','Slack or the app.'],all:'All games →',items:[['Who’s Who','A daily clue about a colleague','#C6DDFF'],['Secret Office Missions','Small secret missions, one reveal','#FFD3B8'],['Shoutouts','Peer thank-yous tied to your values','#FBE7A1']]},
  steps:[
    {when:'Day one',t:'One DM. One tap.',d:'Everyone gets a personal invite from Vilo in Slack. Joining takes a second, and nobody downloads anything.',tip:'Vilo sends a friendly nudge to anyone who hasn\'t joined before sign-ups close.',
     mock:()=>`${vm('10:00',`<b>🎅 Secret Santa is happening!</b><p>One colleague to give to, one gift. The company covers it, you choose it. Nobody knows who has whom until reveal day.</p><p class="mini">Joining closes <b>Mon 7 Dec, 12:00</b></p><div class="btns"><button class="sb" data-act="join">Join</button><button class="sb ghost">Not this time</button></div><div class="mini" data-in>0 colleagues already in</div>`)}`},
    {when:'Right after joining',isNew:1,t:'Three clues about you.',d:'Instead of a gift list, everyone fills in three secret prompts about themselves, like in Who’s Who. Their answers become the clues their person gets about them.',tip:'People learn something new about a colleague, before they even know who it is.',
     mock:()=>`${vm('10:01',`<b>You’re in! 🎉</b><p>Fill in 3 secret prompts about you. We’ll send them, one at a time, as clues to whoever has you.</p>${promptsHTML()}<div class="btns"><button class="sb" data-act="save">Save my clues</button></div>`)}`},
    {when:'Mon 7 Dec · 12:00',t:'Your person arrives.',d:'Joining closes and Vilo draws names across offices and teams. Everyone gets a private DM with one colleague to surprise.',tip:'Only Vilo knows who has whom. Not HR, not managers.',
     mock:()=>`${vm('12:00',`<b>Your match is here 🎁</b><div class="person"><span class="av"></span><div><b>Maya Cohen</b><small>Product Designer · Tel Aviv</small></div></div><p class="mini">Gift <b>before the reveal</b> · <span class="pts">⭐ On time earns 30 Points</span></p>`)}`},
    {when:'Through the week',t:'Clues drop. Guessing starts.',d:'Every couple of days, a new clue about your Santa lands in your DMs, straight from their own answers. Think you know? Lock in a guess before reveal day.',tip:'This is the part people talk about at lunch.',
     mock:()=>`${day('Tuesday')+vm('09:30',`<span class="kick">Clue 1 of 3 · about your Santa</span><p>Their hidden talent: juggling three oranges while walking 🍊</p>`)}${day('Thursday')+vm('09:30',`<span class="kick">Clue 2 of 3</span><p>On a free Sunday they’re on a long bike ride, then a full breakfast</p>`)}${vm('Fri 09:30',`<span class="kick">Clue 3 of 3</span><p>As a kid, they wanted to be a pilot</p><p class="mini">Think you know? Lock in a guess before reveal day. A right guess earns 20 Points.</p><div class="shop"><button class="sb pick" data-act="guess">Omer<br><small>Sales · London</small></button><button class="sb pick" data-act="guess">Sam<br><small>R&amp;D · Berlin</small></button><button class="sb pick" data-act="guess">Chris<br><small>Finance · NYC</small></button></div>`)}`},
    {when:'Before the reveal',t:'A gift shop inside Slack.',d:'A curated shop, already within the budget your company set. No prices, no receipts, no addresses to chase. The receiver gets a link, unwraps the gift on any device, can swap it, and picks office or home delivery. Their Santa never sees the address.',tip:'Remote people are included from day one. The gift comes to them.',
     mock:()=>`<div data-shop>${vm('09:00',`<b>Gift picking is open 🎁</b><p>Choose a gift for Maya Cohen before the reveal.</p><div class="shop"><button class="sb pick sel" data-act="item">Pour-over coffee kit</button><button class="sb pick" data-act="item">Desk plant in a ceramic pot</button><button class="sb pick" data-act="item">Calm Evenings candle</button><button class="sb pick" data-act="item">Artisan chocolate box</button></div><p class="mini">Your note, signed “Your Secret Santa”: For slow coffee mornings ☕ Merry Christmas!</p><div class="btns"><button class="sb" data-act="send">Send gift</button></div>`)}</div><div class="hidden" data-sent>${vm('09:06',`<b>Sent ✓</b><p>Pour-over coffee kit is on its way to Maya. She gets it within a few hours and chooses where it’s delivered.</p><p class="mini"><span class="pts">⭐ +30 Points for giving on time</span></p>`)}${vm('11:42',`<p>Your Secret Santa sent you a gift! 🎁 Open it to see what it is and tell us where to send it.</p><div class="btns"><button class="sb" data-act="open">Open your gift</button></div>`)}</div>`},
    {when:'Reveal day',t:'The reveal.',d:'Every Santa is revealed at the same moment. Guesses are scored, thank-yous fly, and the channel gets a season wrap.',tip:'Points from giving on time and guessing right go to the Vilo leaderboard.',
     mock:()=>`${vm('17:00',`<b>🎄 Reveal time! Your Secret Santa was…</b><div class="person"><span class="av"></span><div><b>Omer Katz</b><small>Sales · London · the orange juggler 🍊</small></div></div><p class="mini">You didn’t lock in a guess this time. 71 people did.</p><div class="btns"><button class="sb" data-act="thanks">Say thank you 💌</button></div>`)}${vm('17:02',`<p>And Maya just found out it was you. She says:</p><p><b>The coffee kit is perfect ☕ Thank you, Daniel!</b></p>`)}${vm('17:10',`<b>That’s a wrap, Santas 🎅</b>`)}`}
  ]};
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const day=t=>`<div class="dayd">${t}</div>`;
function vm(time,html){return `<div class="m"><span class="vav"><i></i></span><div><div class="nm">Vilo<span class="appt">APP</span><em>${time}</em></div>${html}</div></div>`}
const mk=(a,b)=>`${a}<span class="mk">${b}</span>`;
const PROMPTS=['My hidden talent is…','On a free Sunday you’ll find me…','The last thing I googled…','My karaoke song is…','I could eat ___ every day','As a kid I wanted to be…'];
const ANS=['Solving a Rubik’s cube in under two minutes','At the Carmel market with an iced coffee','How long a lemon tree takes to give fruit'];
function promptsHTML(){return `<div class="prs">${[0,1,2].map(i=>`<div class="pr"><span class="pn">${i+1}</span><div class="prb"><button class="psel" data-act="popen"><span>${PROMPTS[i]}</span><i>⌄</i></button><div class="pans">${ANS[i]}</div><ul class="pmenu hidden">${PROMPTS.map(p=>`<li><button data-act="ppick">${p}</button></li>`).join('')}</ul></div></div>`).join('')}</div>`}
function mockWin(i){return `<div class="slack"><div class="hd"><span>Direct message · Vilo</span><span>${GAME.steps[i].when}</span></div><div class="bd">${GAME.steps[i].mock()}</div></div>`}
function stepHTML(s,i,on){return `<div class="step${on?' on':''}" data-i="${i}" tabindex="0" role="button" aria-label="Step ${i+1}: ${s.t}"><div class="t"><span class="n">0${i+1}</span>${s.t}${s.isNew?'<span class="newtag">New</span>':''}</div><div class="d"><div class="when">${s.when}</div>${s.d}<div class="tip">${s.tip}</div></div></div>`}
/* ============ render ============ */
function render(){
  const G=GAME,c=G.color,r=document.documentElement.style;
  r.setProperty('--g',c.g);r.setProperty('--gs',c.gs);r.setProperty('--g-soft',c.soft);
  const hv=(new URLSearchParams(location.search).get('hero')||'D').toUpperCase();
  const season=new URLSearchParams(location.search).get('season')||G.season.state;
  $('#app').innerHTML=`
  <section class="hero" data-hero="${hv}"><div class="wrap">
    <div>
      <span class="tag"><i></i>Vilo ${G.name}</span>
      <h1>${G.hero.h1a}<br><span class="mk">${G.hero.h1b}</span></h1>
      <p class="sub">${G.hero.sub}</p>
      <p class="where">${G.hero.where}</p>
      <div class="cta"><button class="btn pri" data-open>${G.cta.primary}</button><a class="btn sec2" href="${G.cta.call}" target="_blank" rel="noopener">${G.cta.secondary}</a></div>
      <p class="micro">${G.cta.micro}</p>
    </div>
    <div class="scene">
      <div class="sD"><div class="chat"><div class="ch-hd"><span class="vav"><i></i></span><div><b>Vilo <span class="appt">APP</span></b><small>#secret-santa</small></div></div><div class="ch-log" id="hchat"></div><div class="ch-act" id="hact"></div></div></div><div class="sA"><div class="ph"><span><b>Illustration</b>${G.hero.art}</span></div>${dmCard()}</div>
      <div class="sB"><div class="ph"><span><b>Illustration</b>Gift object</span></div>${dmCard()}</div>
      <div class="sC"><div class="slack" style="margin-top:20px"><div class="hd"><span>Direct message · Vilo</span><span>now</span></div><div class="bd" id="typed"></div></div></div>
    </div>
  </div></section>
  <section class="logos"><div class="wrap"><div class="eyebrow">${G.logos.title}</div><div class="row">${G.logos.items.map(x=>`<span>${x}</span>`).join('')}</div></div></section>
  <section class="sec" id="game"><div class="wrap center rv"><div class="eyebrow">${G.demo.eyebrow}</div><h2>${mk(G.demo.h[0],G.demo.h[1])}</h2><p class="lead">${G.demo.lead}</p></div>
    <div class="wrap"><div class="stage" id="stage" style="--n:${G.steps.length}"><div class="stage-in">
      <div class="steps" id="steps">${G.steps.map((s,i)=>stepHTML(s,i,i===0)).join('')}</div>
      <div class="pane"><span class="ph2">Slack mockup</span><div id="mockHost">${mockWin(0)}</div></div>
    </div></div>
    <div class="stage-m">${G.steps.map((s,i)=>stepHTML(s,i,true)+`<div class="pane">${mockWin(i)}</div>`).join('')}</div></div>
  </section>
  <section class="sec hr" id="hr"><div class="wrap center"><div class="rv"><h2>${mk(G.hrp.h[0],G.hrp.h[1])}</h2><p class="lead">${G.hrp.lead}</p></div>
    <div class="panel rv"><div class="kpis">${G.hrp.kpis.map(k=>`<div class="kpi"><div class="v count" data-to="${k[1]}">0</div><div class="l">${k[0]}</div></div>`).join('')}</div><p class="ex">Example data</p></div>
    <div class="ctarow"><button class="btn pri" data-open>${G.cta.primary}</button><a class="btn sec2" href="${G.cta.call}" target="_blank" rel="noopener">${G.cta.secondary}</a></div></div></section>
  <section class="sec"><div class="wrap"><div class="rv"><div class="eyebrow">${G.setup.eyebrow}</div><h2>${mk(G.setup.h[0],G.setup.h[1])}</h2></div>
    <div class="cards3">${G.setup.cards.map(k=>`<div class="card rv"><div class="ph"><span><b>Illustration</b>${k.art}</span></div><h3>${k.t}</h3><p>${k.p}</p>${k.chips?`<div class="chips">${k.chips.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`:''}${k.slider?`<div class="slider"><output id="bo">$50 per gift</output><input type="range" id="br" min="20" max="150" step="5" value="50" aria-label="Budget per gift"><div class="rng"><span>$20</span><span>$150</span></div><div class="chips" id="bg"></div></div>`:''}</div>`).join('')}</div></div></section>
  <section class="sec" style="padding-top:20px"><div class="wrap"><div class="rv"><div class="eyebrow">${G.timeline.eyebrow}</div><h2>${mk(G.timeline.h[0],G.timeline.h[1])}</h2></div>
    <div class="tl rv">${G.timeline.items.map(x=>`<div>${x[0]}<small>${x[1]}</small></div>`).join('')}</div></div></section>
  <section class="sec" id="pricing"><div class="wrap center"><div class="rv"><h2>${mk(G.pricing.h[0],G.pricing.h[1])}</h2><p class="lead">${G.pricing.lead}</p></div>
    <div class="tiers">${G.pricing.tiers.map((t,i)=>`<button class="tier rv${i===0?' free':''}" data-open data-tier="${i}"><small>${t[0]}</small><b>${t[1]}</b><span>${i<5?'+ gifts':'&nbsp;'}</span></button>`).join('')}</div>
